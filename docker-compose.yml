services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - '8000:80'
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - movic

  php:
    build:
      context: ./docker/php
    volumes:
      - ./backend:/var/www/backend
    networks:
      - movic

  mysql:
    image: mysql:8.0
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: movic
      MYSQL_USER: movic
      MYSQL_PASSWORD: movic
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - movic_mysql:/var/lib/mysql
    networks:
      - movic

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - movic_redis:/data
    networks:
      - movic

volumes:
  movic_mysql:
  movic_redis:

networks:
  movic:
    driver: bridge
